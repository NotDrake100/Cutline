<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta property="og:title" content="DCN: Whitefield feeders add a late last trip."/>
<meta property="og:description" content="DCN on YouTube — Whitefield feeder buses add a late last trip."/>
<meta property="og:site_name" content="DCN"/>
<title>DCN on YouTube — Whitefield feeders add a late last trip.</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  :root { --cream:#F6F1E8; --card:#FFFEFB; --ink:#0A0A0A; --muted:rgba(10,10,10,.55); --lime:#E1F435; --line:rgba(10,10,10,.08); }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--cream); color: var(--ink); font-family: Geist, Inter, system-ui, sans-serif; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 18px 28px; border-bottom: 1px solid var(--line); background: var(--card); }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; }
  .mark { width: 28px; height: 28px; border-radius: 7px; background: var(--lime); display: grid; place-items: center; font-family: Anton, sans-serif; }
  article { max-width: 640px; margin: 0 auto; padding: 40px 24px 80px; }
  .kicker { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
  h1 { font-family: Anton, sans-serif; font-size: 40px; line-height: .95; letter-spacing: -.02em; margin: 0 0 16px; }
  .still { display:block; width:100%; height:auto; aspect-ratio:16/9; object-fit:cover; object-position:center; border-radius:20px; margin:0 0 24px; background:var(--card); }
  p { font-size: 16px; line-height: 1.6; }
</style>
</head>
<body>
<header>
  <div class="brand"><div class="mark">D</div> DCN · YouTube</div>
  <span style="font-size:12px;color:var(--muted)">Sample source</span>
</header>
<article>
  <div class="kicker">YouTube · DCN</div>
  <h1>Whitefield feeders add a late last trip.</h1>
  <img class="still" src="/assets/demo/dcn-yt.jpg" alt="Article still" width="1080" height="720" loading="eager"/>
  <p>DCN posted the feeder update. Cached source so Browser can open a real URL while the desk finishes the post.</p>
</article>
</body>
</html>
